{% extends 'base/main.html' %}
{% block content %}
{% load note_extras %}

<style>

  .note {
    padding-bottom: 80vh;
}

  .header-actions a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    padding: 0 12px;
    font-size: 13px;
    line-height: 1;
  }

  .header-actions svg {
    width: 16px;
    height: 16px;
  }

  .btn-edit-note {
    height: 36px; padding: 0 16px;
    width: 60px;
    display: flex; align-items: center; gap: 7px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font-sans);
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    transition: background .15s;
  }
  .btn-edit-note:hover { background: var(--accent-dark); text-decoration: none; color: #fff; }

</style>

<!-- GitHub + xcode Markdown CSS -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/xcode.min.css">

<div class="header-bar" style="display: flex; justify-content: space-between; align-items: center;">
  <h2 style="margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 16px;">
    {{ note.title }}
  </h2>
  <div class="header-actions" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
    <a href="{% url 'notes' %}" class="btn-ghost">
      All Notes
    </a>
    <a href="{% url 'note-update' note.tokens.first.token %}" class="btn-edit-note">
      Edit
    </a>
  </div>
</div>

<div class="note" style="flex-direction: column; align-items: flex-start;">
  <article class="markdown-body" style="width: 100%; background: transparent;">
    {{ note.description|convert_markdown|safe }}
  </article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>hljs.highlightAll();</script>

{% endblock content %}
