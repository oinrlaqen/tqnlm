{% extends 'base/main.html' %}
{% block content %}
{% load note_extras %}

<style>
  .header-actions a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    padding: 0 12px;
    font-size: 13px;
    line-height: 1;
  }

  .header-actions svg {
    width: 16px;
    height: 16px;
  }
</style>

<!-- GitHub Markdown CSS -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

<div class="header-bar" style="display: flex; justify-content: space-between; align-items: center;">
  <h2 style="margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 16px;">
    {{ note.title }}
  </h2>
  <div class="header-actions" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
    <a href="{% url 'notes' %}" class="btn-logout">
      All Notes
    </a>
    <a href="{% url 'note-update' note.pk %}" class="btn-add-note">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Edit
    </a>
  </div>
</div>

<div class="note-card" style="flex-direction: column; align-items: flex-start; padding: 24px 28px;">
  <article class="markdown-body" style="width: 100%; background: transparent;">
    {{ note.description|convert_markdown|safe }}
  </article>
</div>

{% endblock content %}
