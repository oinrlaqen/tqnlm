{% extends 'base/main.html' %}
{% load static %}
{% block content %}

<style>
    /* ── Editable title ───────────────────────────────────────── */
    .title-input {
        font-size: 22px;
        font-weight: 500;
        font-family: var(--font-sans);
        color: var(--text-primary);
        background: transparent;
        border: none;
        outline: none;
        width: 100%;
        padding: 0;
        line-height: 1.2;
        caret-color: var(--accent);
    }
    .title-input::placeholder { color: var(--text-hint); }

    /* ── Tag toolbar ──────────────────────────────────────────── */
    .tag-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0rem 0 1.25rem;
        border-bottom: 0.5px solid var(--border);
        flex-wrap: wrap;
    }

    /* Tag input */
    .tag-input-wrap {
        display: flex;
        align-items: center;
        height: 36px;
        border: 0.5px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        transition: border .15s;
        overflow: hidden;
        min-width: 120px;
        flex: 1;
    }
    .tag-input-wrap:focus-within { border-color: var(--border-mid); }
    .tag-input-wrap input {
        flex: 1;
        height: 100%;
        padding: 0 10px;
        border: none;
        font-size: 13px;
        font-family: var(--font-sans);
        background: transparent;
        color: var(--text-primary);
        outline: none;
    }
    .tag-input-wrap input::placeholder { color: var(--text-hint); }

    /* Small toolbar buttons — match note_list tag/sort button style */
    .toolbar-btn {
        height: 36px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 400;
        font-family: var(--font-sans);
        cursor: pointer;
        white-space: nowrap;
        transition: background .15s, color .15s, border-color .15s;
        flex-shrink: 0;
        min-width: 85px;
    }
    .toolbar-btn-ghost {
        border: 0.5px solid var(--border);
        background: var(--surface);
        color: var(--text-primary);
    }
    .toolbar-btn-ghost:hover {
        border-color: var(--border-mid);
        background: #f5f4f0;
    }
    .toolbar-btn-accent {
        border: 0.5px solid transparent;
        background: var(--accent);
        color: #fff;
        font-weight: 500;
    }
    .toolbar-btn-accent:hover { background: var(--accent-dark); }

    /* ── Markdown info button ─────────────────────────────────── */
    .toolbar-btn-info {
        height: 36px;
        width: 50px;
        min-width: unset;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-md);
        border: 0.5px solid var(--border);
        background: transparent;
        color: var(--text-hint);
        cursor: pointer;
        transition: background .15s, color .15s, border-color .15s;
        flex-shrink: 0;
        text-decoration: none;
    }
    .toolbar-btn-info:hover {
        border-color: var(--border-mid);
        background: #f5f4f0;
        color: var(--text-secondary);
        text-decoration: none;
    }

    /* Select-tag dropdown */
    .select-tag-wrap { position: relative; }
    .select-tag-panel {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 300;
        min-width: 240px;
        background: var(--surface);
        border: 0.5px solid var(--border-mid);
        border-radius: var(--radius-lg);
        padding: 6px;
        box-shadow: 0 8px 24px rgba(0,0,0,.10);
    }
    .select-tag-panel.open { display: block; }

    /* Select-tag dropdown items */
    .select-tag-item {
        padding: 4px 8px;
        border-radius: var(--radius-md);
        font-size: 13px;
        cursor: pointer;
        transition: background .1s;
    }
    .select-tag-item:hover { background: #f5f4f0; }
    .select-tag-item.hidden { display: none; }

    /* Extra pill colors (mirrors note_list) */
    .pill-green   { background: #E3F5E9; color: #1A5C2E; }
    .pill-indigo  { background: #E8EAF6; color: #283593; }
    .pill-rose    { background: #FCE4EC; color: #880E4F; }
    .pill-cyan    { background: #E0F7FA; color: #00606F; }
    .pill-lime    { background: #F0FBE4; color: #3B5E08; }
    .pill-emerald { background: #D9F5E9; color: #065F3C; }
    .pill-violet  { background: #EDE9FE; color: #4C1D95; }
    .pill-fuchsia { background: #FDF4FF; color: #86198F; }
    .pill-sky     { background: #E0F2FE; color: #0C4A6E; }
    .pill-orange  { background: #FFF0E0; color: #7C2D12; }
    .pill-red     { background: #FEECEC; color: #7F1D1D; }
    .pill-yellow  { background: #FEFCE8; color: #713F12; }
    .pill-slate   { background: #F1F5F9; color: #1E293B; }
    .pill-gray    { background: #F3F4F6; color: #1F2937; }
    .pill-zinc    { background: #F4F4F5; color: #18181B; }
    .pill-neutral { background: #F5F5F5; color: #171717; }
    .pill-stone   { background: #F5F5F4; color: #1C1917; }
    .pill-brown   { background: #F3EDE8; color: #5C2E0E; }
    .pill-gold    { background: #FDF8E1; color: #7A5700; }

    /* ── New-note pending tags ────────────────────────────────── */
    .pending-tags-wrap {
        position: relative;
        min-height: 0;
    }
    .pending-tags-wrap:empty { display: none; }
    .pending-tags {
        display: flex;
        flex-wrap: nowrap;
        gap: 4px;
        padding: 10px 0 4px;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        min-height: 0;
    }
    .pending-tags::-webkit-scrollbar { display: none; }
    .pending-tags:empty { display: none; }
    /* Center only when all pills fit without scrolling */
    .pending-tags.not-overflowing { justify-content: center; }

    /* ── Carousel scroll arrows ──────────────────────────────── */
    .carousel-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 2;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 0.5px solid var(--border-mid);
        background: var(--surface);
        color: var(--text-secondary);
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: background .15s, color .15s, border-color .15s;
        flex-shrink: 0;
    }
    .carousel-arrow:hover {
        background: #f5f4f0;
        border-color: var(--border);
        color: var(--text-primary);
    }
    .carousel-arrow.visible { display: flex; }
    .carousel-arrow-left  { left: 0; }
    .carousel-arrow-right { right: 0; }

    /* indent scroll area when arrows are present */
    .pending-tags-wrap.has-left  .pending-tags  { padding-left:  30px; }
    .pending-tags-wrap.has-right .pending-tags  { padding-right: 30px; }

    /* ── Note body — clean, no box ────────────────────────────── */
    .note-body-area { padding-top: 20px; }

    .note-body-area textarea {
        width: 100%;
        padding: 0;
        border: none;
        font-size: 15px;
        font-family: var(--font-sans);
        background: transparent;
        color: var(--text-primary);
        outline: none;
        resize: none;
        line-height: 1.65;
        min-height: 100vh;
        caret-color: var(--accent);
        overflow: hidden;
        padding-bottom: 80vh;
    }
    .note-body-area textarea::placeholder { color: var(--text-hint); }

    /* ── Preview mode ─────────────────────────────────────────── */
    #preview-area {
        display: none;
        padding-top: 20px;
        padding-bottom: 80vh;
    }
    #preview-area.active { display: block; }
    .note-body-area.hidden-edit { display: none; }

    /* ── Syntax highlight mode ────────────────────────────────── */

    .note-body-area { position: relative; }

    #highlight-overlay {
        display: none;
        position: absolute;
        top: 20px; left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        font-size: 15px;
        font-family: var(--font-sans);
        line-height: 1.65;
        padding: 0;
        padding-bottom: 80vh;
        white-space: pre-wrap;
        word-wrap: break-word;
        color: transparent;
        z-index: 1;
        overflow: hidden;
    }
    .note-body-area.highlight-mode #highlight-overlay { display: block; }
    .note-body-area.highlight-mode textarea {
        position: relative;
        z-index: 2;
        color: transparent;
        caret-color: var(--accent);
        background: transparent;
    }

    /* Token colors */
    .hl-heading      { color: #111827; text-shadow: -0.15px 0 0 currentColor, 0.15px 0 0 currentColor; }
    .hl-bold         { color: inherit; text-shadow: -0.15px 0 0 currentColor, 0.15px 0 0 currentColor; }
    .hl-italic       { color: #555555; text-decoration-line: underline; text-decoration-style: dashed; text-underline-offset: 5px; }
    .hl-bold-italic  { color: inherit; text-shadow: -0.15px 0 0 currentColor, 0.15px 0 0 currentColor; }
    .hl-code         { color: #7C3AED; }
    .hl-strike       { color: inherit; text-decoration: line-through; }
    .hl-underline    { color: #059669; }
    .hl-subscript    { color: #059669; }
    .hl-superscript  { color: #059669; }
    .hl-codeblock    { color: #7C3AED; }
    .hl-link-text    { color: #DC2626; }
    .hl-link-url     { color: #06B6D4; }
    .hl-image        { color: #c678dd; }
    .hl-hr           { color: #4b5563; }
    .hl-list-marker  { color: #F97316; text-shadow: -0.15px 0 0 currentColor, 0.15px 0 0 currentColor; }
    .hl-quote        { color: #2563EB; text-shadow: -0.15px 0 0 currentColor, 0.15px 0 0 currentColor; }
    .hl-plain        { color: var(--text-primary); }
    .hl-space        { background: rgba(249, 115, 22, 0.25); border-radius: 2px; }

    /* ── Format popup ─────────────────────────────────────────── */
    #format-popup {
        display: none;
        position: fixed;
        z-index: 9999;
        align-items: center;
        gap: 2px;
        padding: 4px 6px;
        background: var(--surface);
        border: 0.5px solid var(--border-mid);
        border-radius: var(--radius-lg);
        box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    #format-popup.visible { display: flex; }

    .fmt-btn {
        height: 28px;
        min-width: 28px;
        padding: 0 6px;
        border: none;
        background: transparent;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-family: var(--font-sans);
        color: var(--text-primary);
        cursor: pointer;
        transition: background .1s;
    }
    .fmt-btn:hover { background: #f0eeea; }

    .fmt-btn.active { background: #eeeaf5; color: var(--accent); }

</style>

<!-- GitHub + xcode Markdown CSS (used in preview) -->
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/xcode.min.css">

<form method="POST" action="" id="main-note-form">
    {% csrf_token %}

    <!-- ── Header bar ── -->
    <div class="header-bar" style="align-items: center; gap: 12px;">
        <input
            class="title-input"
            type="text"
            name="title"
            id="id_title"
            placeholder="Title here"
            value="{% if form.title.value %}{{ form.title.value }}{% endif %}"
            autocomplete="off"
        >
        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
            <a href="{% url 'notes' %}" class="btn-ghost" id="all-notes-btn">All Notes</a>
            <button type="button" id="preview-toggle-btn" class="btn-ghost" onclick="togglePreview()">
                Preview
            </button>
        </div>
    </div>

    <!-- ── Tag toolbar ── -->
    {# ─── NEW NOTE: client-side pending tags, submitted with the form ─── #}
    <div class="tag-toolbar" id="tag-toolbar">

        <div class="tag-input-wrap">
            <input type="text" id="new-tag-name-create" placeholder="New tag name" maxlength="20" autocomplete="off">
        </div>

        <div class="select-tag-wrap">
            <button type="button" id="selectTagBtnCreate" class="toolbar-btn toolbar-btn-ghost" onclick="toggleSelectPanelCreate(event)">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 2h5.5l6.5 6.5-5.5 5.5L2 7.5V2z"/>
                    <circle cx="5" cy="5" r="1" fill="currentColor" stroke="none"/>
                </svg>
                Tags
            </button>
            <div class="select-tag-panel" id="selectTagPanelCreate">
                {% for tag in user_tags %}
                <div class="select-tag-item" data-tag-name="{{ tag.name|escape }}" onclick="addPendingTagByName(this.dataset.tagName)">{{ tag.name }}</div>
                {% endfor %}
                <div id="no-tags-msg-create" style="display:none; padding:6px 8px; font-size:13px; color:var(--text-hint);">No tags here</div>
            </div>
        </div>

        <!-- ── Markdown syntax reference ── -->
        <a
            href="https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax"
            target="_blank"
            rel="noopener noreferrer"
            class="toolbar-btn-info"
            title="Markdown Syntax"
        >
            <svg width="30" height="20" viewBox="0 0 208 128" fill="none" xmlns="http://www.w3.org/2000/svg">

                <!-- M (clean + readable) -->
                <path d="M48 92V36L80 72L112 36V92" 
                        stroke="#1a1a1a" 
                        stroke-width="12" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        fill="none"/>

                <!-- subtle markdown hint: code bracket -->
                <path d="M160 40L160 88M136 64L160 88L184 64" 
                        stroke="#1a1a1a" 
                        stroke-width="10" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        fill="none"/>
                </svg>
        </a>

        <button type="submit" class="toolbar-btn toolbar-btn-accent">
            Save
        </button>
    </div>

    <!-- Pending tags shown as pills; hidden inputs carry the values -->
    <div class="pending-tags-wrap" id="pending-tags-wrap">
        <button type="button" class="carousel-arrow carousel-arrow-left" id="pending-arrow-left" onclick="carouselScroll('pending-tags-row', -1)" aria-label="Scroll left">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.5 1.5L3 5l3.5 3.5"/>
            </svg>
        </button>
        <div class="pending-tags" id="pending-tags-row"></div>
        <button type="button" class="carousel-arrow carousel-arrow-right" id="pending-arrow-right" onclick="carouselScroll('pending-tags-row', 1)" aria-label="Scroll right">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3.5 1.5L7 5l-3.5 3.5"/>
            </svg>
        </button>
    </div>
    <div id="pending-tags-inputs"></div>

    <!-- ── Note body ── -->
    <div class="note-body-area" id="edit-area">
        <div id="highlight-overlay" aria-hidden="true"></div>
        {{ form.description }}
    </div>

    <!-- ── Preview area ── -->
    <div id="preview-area">
        <article class="markdown-body" id="preview-content" style="background: transparent;"></article>
    </div>

</form>

    <!-- ── Format popup ── -->
    <div id="format-popup">
        <button type="button" class="fmt-btn" data-fmt="plain" title="Plain text">Tx</button>
        <button type="button" class="fmt-btn" data-fmt="bold" title="Bold"><b>B</b></button>
        <button type="button" class="fmt-btn" data-fmt="italic" title="Italic"><i>I</i></button>
        <button type="button" class="fmt-btn" data-fmt="code" title="Code">&lt;/&gt;</button>
        <button type="button" class="fmt-btn" data-fmt="strikethrough" title="Strikethrough"><s>S</s></button>
        <button type="button" class="fmt-btn" data-fmt="underline" title="Underline"><u>U</u></button>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="{% static 'base/js/note_create.js' %}"></script>

{% endblock content %}
