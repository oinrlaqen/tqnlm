{% extends 'base/main.html' %}
{% load i18n %}
{% block content %}

<style>
    .verify-wrap {
        max-width: 380px;
        margin: 4rem auto 0;
        padding: 0 1rem;
    }
    .verify-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 32px 30px 36px;
        text-align: center;
    }
    .verify-card h1 {
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 0.75rem;
        color: var(--text-primary);
    }
    .verify-card p {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.5;
        margin-bottom: 1.5rem;
    }
    .btn-verify {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 36px;
        border: 0.5px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 500;
        font-family: var(--font-sans);
        color: #fff;
        background: var(--accent);
        cursor: pointer;
        transition: background .15s;
    }
    .btn-verify:hover { background: var(--accent-dark); }
</style>

<div class="verify-wrap">
    <div class="verify-card">
        <h1>{% trans "Confirm your email" %}</h1>
        <p>{% trans "Click below to verify your email address" %}</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-verify">{% trans "Verify email" %}</button>
        </form>
    </div>
</div>

{% endblock content %}
